<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta charset="UTF-8">

    <title>Data Creator</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div id="content">

        <h1>Data Creator</h1>

        <p>
            Draw each object as clearly as possible.
        </p>

        <div>

            <input
                id="user"
                type="text"
                placeholder="Type your name"
            />

            <br><br>

            <span id="instructions"></span>

            <br><br>

            <button
                id="advanceBtn"
                onclick="start();">
                START
            </button>

        </div>

        <br>

        <div
            id="sketchPadContainer"
            style="visibility:hidden;">
        </div>

    </div>

    <script src="common/draw.js"></script>
    <script src="js/sketchPad.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        const supabaseUrl =
            "https://sqqmdkzfjaunnifpgutk.supabase.co";

        const supabaseKey =
            "sb_publishable_IFf-k1DYTYuBeCWvWfOvZg_PqGP4om_";

        const supabaseClient =
        window.supabase.createClient(
        supabaseUrl,
        supabaseKey
    );

        let index = 0;

        const labels = [
            "car",
            "fish",
            "house",
            "tree",
            "bicycle",
            "guitar",
            "pencil",
            "clock"
        ];

        const data = {
            user: null,
            session: Date.now(),
            drawings: {}
        };

        const sketchPad =
            new SketchPad(
                document.getElementById(
                    "sketchPadContainer"
                )
            );

        function start(){

            if(user.value.trim() === ""){
                alert(
                    "Please type your name first!"
                );
                return;
            }

            data.user =
                user.value.trim();

            user.style.display = "none";

            sketchPadContainer.style.visibility =
                "visible";

            instructions.innerHTML =
                "Please draw a " +
                labels[index];

            advanceBtn.innerHTML = "NEXT";
            advanceBtn.onclick = next;
        }

        function next(){

            if(
                sketchPad.paths.length === 0
            ){
                alert(
                    "Draw something first!"
                );
                return;
            }

            const label =
                labels[index];

            data.drawings[label] =
                JSON.parse(
                    JSON.stringify(
                        sketchPad.paths
                    )
                );

            sketchPad.reset();

            index++;

            if(index < labels.length){

                instructions.innerHTML =
                    "Please draw a " +
                    labels[index];

            }else{

                sketchPadContainer.style.visibility =
                    "hidden";

                instructions.innerHTML =
                    "All drawings completed.";

                advanceBtn.innerHTML =
                    "SAVE";

                advanceBtn.onclick =
                    save;
            }
        }

        async function save(){

            advanceBtn.disabled =
                true;

            instructions.innerHTML =
                "Uploading data...";

            const { error } =
                await supabaseClient
                    .from("drawings")
                    .insert([
                        {
                            username:
                                data.user,

                            session:
                                data.session,

                            drawings:
                                data.drawings
                        }
                    ]);

            if(error){

                console.error(error);

                instructions.innerHTML =
                    "Upload failed: " +
                    error.message;

                advanceBtn.disabled =
                    false;

                return;
            }

            instructions.innerHTML =
        "Thank you! Your drawings were submitted successfully.";

        advanceBtn.style.display =
            "none";

        setTimeout(()=>{
            location.reload();
        },3000);
        }

    </script>

</body>
</html>
